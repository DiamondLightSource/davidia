packages:
 - 'client/**'
 - 'storybook'
peerDependencyRules:
  allowedVersions:
    react-aria-menubutton>react: "18.x"
allowBuilds:
  "@tree-sitter-grammars/tree-sitter-yaml": true
  bufferutil: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  tree-sitter: true
  tree-sitter-json: true
  utf-8-validate: true
  "@scarf/scarf": false
overrides:
#  minimist: "^0.2.4" # from tsconfig-paths@4.2.0
  markdown-it: "^14.3.3" # from typedoc@0.28.20
minimumReleaseAge: 4320 # packages must be at least 3 days old
minimumReleaseAgeExclude:
   - '@h5web/lib'
