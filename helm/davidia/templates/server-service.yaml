{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app.kubernetes.io/name: davidia-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
{{- end }}