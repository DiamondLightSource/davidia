server:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/diamondlightsource/davidia-server
    tag: "0.1.3-rc.2"
    pullPolicy: IfNotPresent

  port: 8000

  service:
    type: ClusterIP

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true

ui-base:
  name: davidia
  host: p48.diamond.ac.uk

  image:
    repository: ghcr.io/diamondlightsource/davidia-client
    tag: "0.1.3-rc.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  ui:
    port: 8080

  identityProvider: prod

  upstreams:
    - id: davidia-server
      path: /api/
      rewriteTarget: /
      ws: true
      target:
        service:
          name: davidia-server
          port: 8000