# Need some info for the backend, then some for the frontend
# Need an image for this that contains all of the stuff - i.e., typescript
# (and another one for the python side of things with environment.yaml)
# currently all on conda so presumably i can transfer over?
# need to change this so the UI is in a different pod to the backend

replicaCount: 1

client:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/diamondlightsource/davidia-client
    tag: "0.0.4"
    pullPolicy: IfNotPresent
  port: 8080
  service:
    type: ClusterIP

image:
  pullPolicy: IfNotPresent

server:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/diamondlightsource/davidia-server
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  port: 8000
  service:
    type: ClusterIP

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000

containerPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: davidia.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - davidia.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
